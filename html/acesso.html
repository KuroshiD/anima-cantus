<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Anima Cantus</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./shared.css">
  <script src="./shared.js"></script>

  <style>
    /* ===== Particular: Acesso (login / cadastro) ===== */

    /* Abas Entrar / Criar conta */
    .auth__tabs {
      display: flex;
      margin: 2rem 0 1.75rem;
      border-bottom: 1px solid var(--line);
    }

    .auth__tab {
      flex: 1;
      padding: 0.75rem 0.5rem;
      margin-bottom: -1px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .auth__tab:hover { color: var(--ink); }

    .auth__tab[aria-selected="true"] {
      border-bottom-color: var(--green);
      color: var(--ink);
      font-weight: 500;
    }

    .form__aux {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.8125rem;
    }

    .form__switch { margin-top: 0.25rem; text-align: center; color: var(--muted); font-size: 0.8125rem; }
  </style>
</head>
<body>

  <!-- Ícones usados nesta página -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.7C3.9 8.5 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  </svg>

  <div class="auth">

    <aside class="auth__panel">
      <a class="auth__brand" href="acesso.html" aria-label="Anima Cantus">
        <span>Anima</span> <span>Cantus</span>
      </a>

      <!-- Pauta musical decorativa -->
      <svg class="auth__staff" viewBox="0 0 800 100" preserveAspectRatio="none" aria-hidden="true">
        <g stroke="currentColor" stroke-width="1">
          <line x1="0" y1="10" x2="800" y2="10"/>
          <line x1="0" y1="30" x2="800" y2="30"/>
          <line x1="0" y1="50" x2="800" y2="50"/>
          <line x1="0" y1="70" x2="800" y2="70"/>
          <line x1="0" y1="90" x2="800" y2="90"/>
        </g>
      </svg>

      <div class="auth__quote">
        <p class="auth__quote-text">A música acompanha cada etapa da história de vocês.</p>
      </div>
    </aside>

    <main class="auth__main">
      <div class="auth__box">

        <p class="eyebrow" style="color: var(--green); font-weight: 600;">Área do casal</p>
        <h1 class="heading-serif auth__title" id="title">Bem-vindos de volta</h1>
        <p class="auth__sub" id="subtitle">Entrem para continuar a jornada de vocês.</p>

        <div class="auth__tabs" role="tablist" aria-label="Acesso">
          <button class="auth__tab" role="tab" type="button" id="tab-login" aria-controls="login" aria-selected="true" data-target="login">Entrar</button>
          <button class="auth__tab" role="tab" type="button" id="tab-cadastro" aria-controls="cadastro" aria-selected="false" data-target="cadastro" tabindex="-1">Criar conta</button>
        </div>

        <!-- ===== Login ===== -->
        <form class="form" id="login" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <div class="field">
            <label class="field__label" for="login-email">E-mail</label>
            <input class="input" id="login-email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" data-rules="required email" aria-describedby="login-email-err">
            <p class="field__error" id="login-email-err" role="alert"></p>
          </div>

          <div class="field">
            <label class="field__label" for="login-senha">Senha</label>
            <div class="field__control">
              <input class="input has-toggle" id="login-senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" data-rules="required" aria-describedby="login-senha-err">
              <button class="field__toggle" type="button" data-toggle="login-senha" aria-label="Mostrar senha"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button>
            </div>
            <p class="field__error" id="login-senha-err" role="alert"></p>
          </div>

          <div class="form__aux">
            <label class="check" style="color: var(--ink);">
              <input type="checkbox" name="lembrar"> Manter conectado
            </label>
            <a class="link" href="redefinir-senha.html">Esqueci a senha</a>
          </div>

          <button class="btn btn--primary form__submit" type="submit">Entrar <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>

          <p class="form__switch">Ainda não têm conta? <button class="link" type="button" data-target="cadastro">Criar conta</button></p>
        </form>

        <!-- ===== Cadastro ===== -->
        <form class="form" id="cadastro" role="tabpanel" aria-labelledby="tab-cadastro" hidden novalidate>
          <div class="form__row">
            <div class="field">
              <label class="field__label" for="cad-nome1">Seu nome</label>
              <input class="input" id="cad-nome1" name="nome1" type="text" autocomplete="given-name" placeholder="Marina" data-rules="required" aria-describedby="cad-nome1-err">
              <p class="field__error" id="cad-nome1-err" role="alert"></p>
            </div>
            <div class="field">
              <label class="field__label" for="cad-nome2">Nome do(a) parceiro(a)</label>
              <input class="input" id="cad-nome2" name="nome2" type="text" placeholder="Rafael" data-rules="required" aria-describedby="cad-nome2-err">
              <p class="field__error" id="cad-nome2-err" role="alert"></p>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="cad-email">E-mail</label>
            <input class="input" id="cad-email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" data-rules="required email" aria-describedby="cad-email-err">
            <p class="field__error" id="cad-email-err" role="alert"></p>
          </div>

          <div class="field">
            <label class="field__label" for="cad-data">Data do casamento</label>
            <input class="input" id="cad-data" name="data" type="date" data-rules="required future" aria-describedby="cad-data-err">
            <p class="field__error" id="cad-data-err" role="alert"></p>
          </div>

          <div class="field">
            <label class="field__label" for="cad-senha">Senha</label>
            <div class="field__control">
              <input class="input has-toggle" id="cad-senha" name="senha" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" data-rules="required min8" aria-describedby="cad-senha-err">
              <button class="field__toggle" type="button" data-toggle="cad-senha" aria-label="Mostrar senha"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button>
            </div>
            <p class="field__error" id="cad-senha-err" role="alert"></p>
          </div>

          <div class="field">
            <label class="field__label" for="cad-senha2">Confirmar senha</label>
            <input class="input" id="cad-senha2" name="senha2" type="password" autocomplete="new-password" placeholder="Repita a senha" data-rules="required match:cad-senha" aria-describedby="cad-senha2-err">
            <p class="field__error" id="cad-senha2-err" role="alert"></p>
          </div>

          <label class="check" id="cad-termos-wrap">
            <input type="checkbox" id="cad-termos" name="termos" data-rules="checked">
            <span>Li e concordo com os <a class="link" href="termos.html" target="_blank" rel="noopener">Termos de uso</a> e a <a class="link" href="privacidade.html" target="_blank" rel="noopener">Política de privacidade</a>.</span>
          </label>

          <button class="btn btn--primary form__submit" type="submit">Criar conta <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>

          <p class="form__switch">Já têm conta? <button class="link" type="button" data-target="login">Entrar</button></p>
        </form>

        <p class="auth__foot">Seus dados são usados apenas para organizar a música da cerimônia de vocês.</p>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var $ = function (s, r) { return (r || document).querySelector(s); };
      var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

      /* ---------- Abas ---------- */
      var COPY = {
        login:    { title: 'Bem-vindos de volta', sub: 'Entrem para continuar a jornada de vocês.', page: 'Entrar' },
        cadastro: { title: 'Criem sua conta',     sub: 'Comecem a organizar a música da cerimônia.', page: 'Criar conta' }
      };

      function show(name, focus) {
        $$('.auth__tab').forEach(function (t) {
          var on = t.dataset.target === name;
          t.setAttribute('aria-selected', on);
          t.tabIndex = on ? 0 : -1;
        });
        $$('.form').forEach(function (f) { f.hidden = f.id !== name; });
        $('#title').textContent = COPY[name].title;
        $('#subtitle').textContent = COPY[name].sub;
        document.title = COPY[name].page + ' — Anima Cantus';
        history.replaceState(null, '', name === 'cadastro' ? '#cadastro' : location.pathname + location.search);
        if (focus) { var first = $('.input', document.getElementById(name)); if (first) first.focus(); }
      }

      document.addEventListener('click', function (e) {
        var t = e.target.closest('[data-target]');
        if (t) show(t.dataset.target, true);
      });

      $('.auth__tabs').addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        var next = document.activeElement.dataset.target === 'login' ? 'cadastro' : 'login';
        show(next);
        $('#tab-' + next).focus();
      });

      show(location.hash === '#cadastro' ? 'cadastro' : 'login');
      window.addEventListener('hashchange', function () { show(location.hash === '#cadastro' ? 'cadastro' : 'login'); });

      /* ---------- Login ---------- */
      AC.bindForm($('#login'), function (form, data) {
        AC.submitting(form, 'Entrando… ');
        // TODO: POST /login { email, senha, lembrar } -> sessão. Tratar 401 e "e-mail não confirmado"
        //       (nesse caso, redirecionar para verificar-email.html?email=...).
        AC.store.set('sessao', { email: data.email });
        setTimeout(function () { location.href = 'minha-jornada.html'; }, 700);
      });

      /* ---------- Cadastro ---------- */
      AC.bindForm($('#cadastro'), function (form, data) {
        AC.submitting(form, 'Criando conta… ');

        // O aceite dos termos é enviado e registrado junto com o cadastro.
        var payload = {
          nome1: data.nome1, nome2: data.nome2, email: data.email,
          dataCasamento: data.data, senha: data.senha,
          aceite: { termos: true, privacidade: true, versao: AC.LEGAL_VERSION, aceitoEm: new Date().toISOString() }
        };
        // TODO: POST /cadastro com `payload` (a API grava versão + data/hora do aceite e dispara o e-mail de confirmação).

        AC.store.set('perfil', { nome1: data.nome1, nome2: data.nome2, email: data.email, data: data.data });
        AC.store.set('aceite', payload.aceite);
        AC.store.set('contrato:status', 'sem-contrato');
        setTimeout(function () {
          location.href = 'verificar-email.html?email=' + encodeURIComponent(data.email);
        }, 700);
      });
    })();
  </script>
</body>
</html>
