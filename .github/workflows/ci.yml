name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anima/shared build
      - run: pnpm --filter @anima/api exec prisma generate
        env:
          DATABASE_URL: postgresql://anima:anima@localhost:5432/anima
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @anima/api build
      - run: pnpm --filter @anima/web build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile --target runtime .
      - run: docker build -f web/Dockerfile --target runtime .
