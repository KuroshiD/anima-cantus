services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks: [public]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
      minio: { condition: service_healthy }

  certbot:
    image: certbot/certbot
    profiles: ["https"]
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'
    networks: [public]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    env_file: .env.web
    networks: [public]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: migrate
    command: npx prisma migrate deploy
    restart: "no"
    env_file: .env.migrate
    networks: [private]
    depends_on:
      db: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    command: node dist/main.js
    restart: unless-stopped
    env_file: .env.api
    networks: [public, private]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    command: node dist/modules/worker/worker.js
    restart: unless-stopped
    env_file: .env.worker
    networks: [public, private]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/prisma/init:/docker-entrypoint-initdb.d:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes: [redisdata:/data]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env.minio
    volumes: [miniodata:/data]
    networks: [public, private]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  clamav:
    image: clamav/clamav
    profiles: ["scan"]
    restart: unless-stopped
    networks: [private]

networks:
  public: {}
  private:
    internal: true

volumes:
  certbot_www:
  certbot_conf:
  pgdata:
  redisdata:
  miniodata:
