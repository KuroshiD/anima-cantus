map $http_origin $storage_cors_origin {
  default "";
  ~^https?://localhost(:[0-9]+)?$ $http_origin;
  ~^https://seudominio\.com$ $http_origin;
  ~^https://www\.seudominio\.com$ $http_origin;
}

# Site e API
server {
  listen 80;
  server_name _;
  client_max_body_size 1m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
}

# Armazenamento (somente a porta S3 do MinIO, para as URLs pré-assinadas)
server {
  listen 80;
  server_name storage.localhost storage.seudominio.com;
  client_max_body_size 20m;
  proxy_buffering off;
  proxy_request_buffering off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $storage_cors_origin always;
      add_header Access-Control-Allow-Methods "GET, HEAD, PUT, OPTIONS" always;
      add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
      add_header Access-Control-Max-Age 3000 always;
      add_header Vary Origin always;
      return 204;
    }

    add_header Access-Control-Allow-Origin $storage_cors_origin always;
    add_header Access-Control-Expose-Headers ETag always;
    add_header Vary Origin always;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_pass http://minio:9000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# HTTPS (ativar quando houver domínio): trocar `listen 80` por `listen 443 ssl`
# nos dois blocos acima, manter um bloco `listen 80` apenas com o desafio ACME
# e `return 301 https://$host$request_uri;`, e adicionar:
#   ssl_certificate     /etc/letsencrypt/live/seudominio.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/seudominio.com/privkey.pem;
